alse, "Night City's late mayor, ex-rockerboy and community organizer.", "lucius-rhyne"], ["Fingers", "Independents", "Westbrook", [8, 8, 14, 14, 12], false, "Finn Gerstatt, the unlicensed ripperdoc of Jig-Jig Street.", "fingers"], ["Garry the Prophet", "Independents", "Watson", [8, 10, 10, 12, 10], false, "Gerald Winkler, street preacher. Will not stop talking.", "garry-the-prophet"], ["Brendan", "Independents", "Westbrook", [15, 3, 9, 16, 14], false, "Sentient SoftSys vending machine. Philosopher and conversationalist. Immovable.", "brendan"], ["Ozob Bozo", "Independents", "Pacifica", [17, 12, 11, 9, 12], false, "Grenade-wielding clown merc. Laughs at pain.", "ozob-bozo"], ["Mama Welles", "Independents", "Heywood", [12, 8, 13, 14, 14], false, "Guadalupe Alejandra Welles, Jackie's mom, who runs El Coyote Cojo. Nobody pushes her.", "mama-welles"], ["Russel Greene", "Independents", "Badlands", [15, 17, 13, 10, 13], false, "Ex-military cyberpsycho at the Rocky Ridge homestead.", "russel-greene"], ["Diego Ramirez", "Independents", "Pacifica", [15, 17, 14, 10, 13], false, "Ex-solo cyberpsycho in Pacifica, all Sandevistan.", ""], ["Cedric Muller", "Independents", "City Center", [16, 14, 15, 10, 14], false, "Red Ocher nomad gone psycho downtown. Cyberarm, cyberoptics.", "cedric-muller"]].map((r,i)=>({id:i,name:r[0],aff:r[1],dist:r[2],at:r[3],legend:r[4],blurb:r[5],img:r[6],st:tr(r[3])}));
// stats: SPD STR SMT TGH HND
const POS=[['QB',[1,0,4,1,2,3]],['RB',[4,2,0,2,1,1]],['WR',[4,0,1,0,3,1]],['WR',[4,0,1,0,3,1]],['SLOT',[4,0,2,0,2,1]],['TE',[1,3,0,2,2,0]],['LT',[0,4,1,3,1,0]],['LG',[0,4,0,3,1,0]],['C',[0,3,2,3,1,0]],['RG',[0,4,0,3,1,0]],['RT',[0,4,1,3,1,0]],['EDGE',[3,3,0,2,0,0]],['DT',[0,4,0,4,0,0]],['DT',[0,4,0,4,0,0]],['EDGE',[3,3,0,2,0,0]],['LB',[2,3,2,2,0,1]],['LB',[2,3,2,2,0,1]],['CB',[4,0,1,0,2,1]],['CB',[4,0,1,0,2,1]],['S',[3,1,2,1,1,1]],['S',[3,1,2,1,1,1]],['K',[0,1,0,0,2,5]]];
function rating(c,p){const w=POS[p][1];let s=0,t=0;w.forEach((x,j)=>{s+=x*c.st[j];t+=x});return s/t}
const COMBOS=[["Choom Squad", ["V", "Jackie Welles", "Johnny Silverhand"], 30], ["Samurai Reunion", ["Johnny Silverhand", "Kerry Eurodyne", "Bes Isis", "Denny", "Henry"], 30], ["Konpeki Heist Crew", ["V", "Jackie Welles", "T-Bug", "Dexter DeShawn", "Evelyn Parker"], 25], ["Old Flames", ["Johnny Silverhand", "Rogue Amendiares"], 12], ["Judy & Evelyn", ["Judy Alvarez", "Evelyn Parker"], 10], ["Clouds Drama", ["Evelyn Parker", "Maiko Maeda", "Woodman"], 10], ["Arasaka Dynasty", ["Saburo Arasaka", "Yorinobu Arasaka", "Hanako Arasaka"], 20], ["Loyal Blades", ["Goro Takemura", "Sandayu Oda"], 12], ["Ripper & Partner", ["Viktor Vektor", "Misty Olszewski"], 8], ["Bright Family", ["Panam Palmer", "Saul Bright", "Mitch Anderson"], 15], ["Afterlife Regulars", ["Rogue Amendiares", "Claire Russell", "Nix"], 15], ["Maelstrom Civil War", ["Royce", "Brick", "Dum Dum"], 15], ["Brick Loyalists", ["Brick", "Patricia", "Ellis Carter"], 10], ["Voodoo Council", ["Placide", "Brigitte"], 10], ["Familia", ["Jackie Welles", "Mama Welles"], 10], ["Old Barrio", ["Jackie Welles", "Gustavo Orta", "Padre"], 12], ["Peralez Household", ["Jefferson Peralez", "Elizabeth Peralez"], 8], ["Old Partners", ["T-Bug", "Rhino"], 8], ["Beast in Me Rivals", ["Claire Russell", "Peter Sampson"], 6], ["Ghost Town Grudge", ["Panam Palmer", "Nash"], 6]];
function chemistry(lineup){const used=lineup.filter(Boolean),names=new Set(used.map(c=>c.name)),out=[];COMBOS.forEach(([n,m,b])=>{if(m.every(x=>names.has(x)))out.push([n,b])});const cnt={};used.forEach(c=>cnt[c.aff]=(cnt[c.aff]||0)+1);Object.entries(cnt).forEach(([a,n])=>{if(n>=3)out.push([a+' x'+n,(n-2)*6])});return out}
function teamScore(lineup){const used=lineup.filter(Boolean);if(!used.length)return 0;let avg=lineup.reduce((s,c,p)=>s+(c?rating(c,p):0),0)/22;const cnt={};used.forEach(c=>cnt[c.aff]=(cnt[c.aff]||0)+1);let chem=Math.min(80,chemistry(lineup).reduce((s,x)=>s+x[1],0));return Math.round(300+(avg-45)*17+chem)}
const OPP=[['Pacifica Scavs',350],['Wraiths Raiders',390],['Coyote Cojo Regulars',430],['Animals Pit Crew',470],['Moxes',505],['6th Street Patriots',540],['Valentinos',575],['Maelstrom Ripjacks',610],['Voodoo Boys',645],['Tyger Claws',680],['NCPD Precinct 9',715],['Aldecaldos Convoy',750],['Kang Tao Security',785],['Biotechnica Enforcers',815],['Militech Strike Team',845],['MaxTac',880],['Arasaka Elite',910]];
const K=56;function winP(s,o){return Math.min(0.985,1/(1+Math.exp(-(s-o)/K)))}
function season(s,rnd=Math.random){return OPP.map(([n,o])=>({n,o,w:rnd()<winP(s,o)}))}
function newRun(){return{lineup:Array(22).fill(null),used:new Set(),round:0,affR:1,distR:1,roll:null}}
function legends(run){return run.lineup.filter(c=>c&&c.legend).length}
function eligible(run){const L=legends(run)>=3;return CHARS.filter(c=>!run.used.has(c.id)&&!(L&&c.legend))}
function rollAff(run,rnd=Math.random){const el=eligible(run);const affs=[...new Set(el.map(c=>c.aff))];const a=affs[Math.floor(rnd()*affs.length)];rollDist(run,a,rnd)}
function rollDist(run,a,rnd=Math.random){const el=eligible(run).filter(c=>c.aff===a);const ds=[...new Set(el.map(c=>c.dist))];const d=ds[Math.floor(rnd()*ds.length)];let opts=el.filter(c=>c.dist===d);let fb=false;if(opts.length<2){opts=el;fb=true}run.roll={aff:a,dist:fb?'All districts':d,opts}}
if(typeof module!=='undefined')module.exports={chemistry,COMBOS,CHARS,POS,rating,teamScore,OPP,winP,season,newRun,eligible,rollAff,rollDist,legends};

const $=s=>document.querySelector(s);const AT=['BODY','REFLEXES','TECH','INTEL','COOL'],FT=['SPD','STR','VIS','TGH','HND','CLT'];
function ini(n){return n.replace(/[^A-Za-z ]/g,'').split(' ').filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase()}
function av(c,cls='av'){return c.img?`<img class="${cls}" src="img/${c.img}.webp" alt="" onerror="this.outerHTML='<span class=&quot;${cls} ini&quot;>${ini(c.name)}</span>'">`:`<span class="${cls} ini">${ini(c.name)}</span>`}
const FLAV={w:['flatlined their secondary','ran the Sandevistan sweep for six','blitzed through their ICE','hacked the play clock','ate their O-line like street tacos'],l:['got quickhacked into a fumble','lost to a cyberpsycho blitz','choked in the red zone','had the Relic glitch at the worst time','got Kerenzikov-ed on the last drive']};
let run,phase='draft',sel=null;
function rarity(c){if(c.legend)return['LEGEND','leg'];const a=c.at.reduce((s,x)=>s+x,0);return a>=72?['EPIC','epi']:a>=62?['RARE','rar']:['COMMON','com']}
function start(){run=newRun();phase='draft';$('#end').hidden=true;$('#draft').hidden=false;nextRound()}
function nextRound(){if(run.round>=22)return finish();rollAff(run);sel=null;render(true)}
function render(anim){$('#round').textContent=`ROUND ${run.round+1}/22`;$('#score').textContent=teamScore(run.lineup);$('#leg').textContent=`Legends ${legends(run)}/3`;
const r=run.roll;$('#roll').innerHTML=`<span class="glitch" data-t="${r.aff}">${r.aff}</span> · <span class="cy">${r.dist}</span>`;if(anim){$('#roll').classList.remove('pop');void $('#roll').offsetWidth;$('#roll').classList.add('pop')}
$('#rrA').disabled=!run.affR;$('#rrD').disabled=!run.distR||r.dist==='All districts';
$('#opts').innerHTML=r.opts.map((c,i)=>{const[rn,rc]=rarity(c);return`<div class="card ${rc}" style="animation-delay:${i*60}ms" onclick="pick(${c.id})"><div class="tag">${rn}</div><div class="hd">${av(c)}<div><b>${c.name}</b><small>${c.aff} · ${c.dist}</small></div></div><div class="st">${c.at.map((v,j)=>`<div><small>${AT[j]}</small><big>${v}</big></div>`).join('')}</div><em>${c.blurb}</em></div>`}).join('');
$('#field').innerHTML=POS.map(([p],i)=>{const c=run.lineup[i];return`<div class="slot ${c?'full':''}"><b>${p}</b>${c?`${av(c,'av sm')}<span>${c.name}</span>`:''}</div>`}).join('');
$('#picker').hidden=!sel;if(sel)$('#picker').innerHTML=`<div class="pk"><div class="hd">${av(sel)}<b>Place ${sel.name}</b></div><div class="pos">${POS.map(([p],i)=>run.lineup[i]?'':`<button onclick="place(${i})">${p}</button>`).join('')}</div><button class="cancel" onclick="sel=null;render()">✕ Back</button></div>`;
const ch=chemistry(run.lineup);$('#chem').innerHTML=ch.map(([n,b])=>`<span class="chip">⚡ ${n} +${b}</span>`).join('')}
function pick(id){sel=CHARS[id];render()}
function place(i){if(!sel||run.lineup[i])return;const before=chemistry(run.lineup).map(x=>x[0]);run.lineup[i]=sel;run.used.add(sel.id);const nw=chemistry(run.lineup).filter(x=>!before.includes(x[0]));if(nw.length)toast('CHEMISTRY UNLOCKED: '+nw.map(x=>x[0]).join(', '));run.round++;nextRound()}
function reroll(t){if(t==='a'&&run.affR){run.affR=0;rollAff(run)}else if(t==='d'&&run.distR){run.distR=0;rollDist(run,run.roll.aff)}sel=null;render(true)}
function toast(t){const e=$('#toast');e.textContent=t;e.className='show';setTimeout(()=>e.className='',2200)}
function grade(w){return w==17?'S+':w>=16?'S':w>=14?'A':w>=12?'B':w>=9?'C':w>=6?'D':'F'}
function finish(){$('#draft').hidden=true;$('#end').hidden=false;const S=teamScore(run.lineup),g=season(S),w=g.filter(x=>x.w).length;
$('#games').innerHTML='';$('#final').innerHTML='';g.forEach((x,i)=>setTimeout(()=>{const f=FLAV[x.w?'w':'l'][Math.floor(Math.random()*5)];$('#games').insertAdjacentHTML('beforeend',`<div class="g ${x.w?'win':'loss'}"><b>WK${i+1} ${x.w?'W':'L'}</b> vs ${x.n} (${x.o}) <small>${f}</small></div>`);if(i==16)showFinal(S,w)},i*220));}
function showFinal(S,w){const gr=grade(w);const best=JSON.parse(localStorage.cp170best||'null');if(!best||w>best.w||(w==best.w&&S>best.s))localStorage.cp170best=JSON.stringify({w,s:S});const b=JSON.parse(localStorage.cp170best);
$('#final').innerHTML=`<h2 class="${w==17?'perfect glitch':''}" data-t="${w}-${17-w}">${w}-${17-w}</h2><div class="grade">GRADE ${gr}</div><p>Team Score <b>${S}</b> · Best ever: ${b.w}-${17-b.w} (${b.s})</p>${w==17?'<p class="perfect">PERFECT SEASON. NIGHT CITY LEGEND.</p>':''}<h3>Your lineup: how their attributes translated to football</h3><div class="ft">${POS.map(([p],i)=>{const c=run.lineup[i];return`<div>${av(c,'av sm')}<b>${p}</b> ${c.name} <small>${FT.map((k,j)=>k+' '+Math.round(c.st[j])).join(' · ')}</small></div>`}).join('')}</div><small>Body→strength/toughness · Reflexes→speed/hands · Tech→hands/technique · Intelligence→vision · Cool→toughness/clutch &amp; kicking</small>`;
window.shareText=`🏈 Cyberpunk 2077 17-0 Challenge\nRecord: ${w}-${17-w} (Grade ${gr})${w==17?' 🔥 PERFECT SEASON':''}\nTeam Score: ${S}\n`+POS.map(([p],i)=>`${p}: ${run.lineup[i].name}`).join('\n')+(chemistry(run.lineup).length?`\nChemistry: ${chemistry(run.lineup).map(x=>x[0]).join(', ')}`:'')+`\nPlay: ${location.href.split('#')[0]}`;}
function copy(){navigator.clipboard.writeText(window.shareText).then(()=>toast('Copied! Paste it in a text.'),()=>prompt('Copy:',window.shareText))}
start();
</script></body></html>
